<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{% block title %}{{ site_name }}{% endblock %}</title>
<meta name="description" content="{% block description %}Original series, talk shows, live broadcasts, and news from {{ site_name }}.{% endblock %}" />
<link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}" />
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a href="{{ url_for('home') }}" class="brand"><span class="mark">MM</span> {{ site_name }}</a>
    <nav class="nav-desktop">
      <a href="{{ url_for('shows_list') }}" class="nav-link">Shows</a>
      <a href="{{ url_for('news_list') }}" class="nav-link">News</a>
      <a href="{{ url_for('live_list') }}" class="nav-link">Live</a>
      <a href="{{ url_for('ads_list') }}" class="nav-link">Sponsors</a>
    </nav>
    <div class="header-actions">
      <a href="{{ url_for('live_list') }}" class="btn btn-primary btn-sm">▶ Watch Live</a>
    </div>
  </div>
</header>

{% block content %}{% endblock %}

<footer class="site-footer">
  <div class="wrap">
    <p>© 2026 {{ site_name }}. All rights reserved. (Demo site)</p>
    <p><a href="{{ url_for('admin_login') }}" style="color:inherit; text-decoration:underline;">Admin</a></p>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/site.js') }}"></script>
</body>
</html>
